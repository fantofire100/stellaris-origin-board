<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellaris — Origin Claim Board</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="title-line">
    <h1>STELLARIS — ORIGIN CLAIM BOARD</h1>
  </div>
  <p class="subtitle">Exclusive Origins</p>

  <div class="stats-bar">
    <div class="stat">
      <span class="stat-num" id="total-count">0</span>
      <span class="stat-label">Total Origins</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="claimed-count">0</span>
      <span class="stat-label">Claimed</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="free-count">0</span>
      <span class="stat-label">Available</span>
    </div>
  </div>

  <p class="wiki-link">
    <a href="https://stellaris.paradoxwikis.com/Origin" target="_blank" rel="noopener noreferrer">📘 View all origins on the Stellaris Wiki</a>
  </p>
</header>

<nav class="filters" id="filters" aria-label="Origin filters"></nav>

<div class="search-bar">
  <input class="search-input" type="text" id="search-input" placeholder="Search origins..." autocomplete="off">
</div>

<main>
  <section>
    <div class="grid" id="origin-grid"></div>
    <p class="empty-state" id="empty-state" hidden>No origins match your search.</p>
  </section>

  <section>
    <h2 class="section-heading">Exclusive Systems</h2>
    <div class="grid" id="system-grid"></div>
  </section>
</main>

<div class="modal-overlay" id="claim-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="claim-title">
    <h2 class="modal-title" id="claim-title">Claim Origin</h2>
    <p class="modal-subject" id="claim-subject"></p>
    <label class="modal-label" for="claim-name">Discord Username</label>
    <input class="modal-input" type="text" id="claim-name" placeholder="Enter your Discord username..." maxlength="40" autocomplete="off">
    <p class="modal-error" id="claim-error" hidden>Please enter your name.</p>
    <div class="modal-actions">
      <button class="btn btn--cancel" type="button" id="claim-cancel">Cancel</button>
      <button class="btn btn--confirm" type="button" id="claim-confirm">Claim</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="admin-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="admin-title">
    <h2 class="modal-title" id="admin-title">Admin Login</h2>
    <label class="modal-label" for="admin-password">Password</label>
    <input class="modal-input" type="password" id="admin-password" placeholder="Enter admin password..." autocomplete="current-password">
    <p class="modal-error" id="admin-error" hidden>Login failed.</p>
    <div class="modal-actions">
      <button class="btn btn--cancel" type="button" id="admin-cancel">Cancel</button>
      <button class="btn btn--confirm" type="button" id="admin-confirm">Login</button>
    </div>
  </div>
</div>

<footer class="admin-bar">
  <button class="btn btn--accent" type="button" id="admin-login">Admin Login</button>
  <button class="btn btn--accent" type="button" id="admin-logout" hidden>Admin Logout</button>
  <button class="btn btn--accent btn--alert" type="button" id="admin-clear" hidden>⚠ Clear All Claims</button>
</footer>

<template id="card-template">
  <article class="card">
    <div class="card-header">
      <h3 class="card-name"></h3>
      <span class="badge"></span>
    </div>
    <p class="card-desc"></p>
    <div class="card-footer">
      <div class="card-status">
        <span class="status-dot"></span>
        <span class="card-status-text"></span>
      </div>
      <button class="btn" type="button"></button>
    </div>
  </article>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
